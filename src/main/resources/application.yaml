logging:
  level:
    web: debug
management:
  endpoint:
    beans:
      enabled: true
    conditions:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,beans,conditions
    access:
      default: none

server:
  port: 8080
spring:
  main:
    log-startup-info: true
  application:
    name: springboot
  banner:
    location: banner.txt
    charset: utf-8

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false